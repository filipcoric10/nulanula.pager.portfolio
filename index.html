const app = document.getElementById('app');
let io, timer;
function render(){
  const c = COPY[lang];
  document.documentElement.lang = lang === 'SR' ? 'sr' : 'en';
  document.getElementById('hintTxt').textContent = c.scroll;
  app.innerHTML = mobile(c) + desktop(c);
  bindReveal(); bindRotators(); paintIntro();
}

const fmtNum = n => n.toLocaleString(lang === 'SR' ? 'de-DE' : 'en-US');
function countUp(root, instant){
  root.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count, suf = el.dataset.suf || '';
    if (instant || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = fmtNum(to) + suf; return; }
    const t0 = performance.now(), dur = 1600, delay = 250;
    const step = now => {
      const k = Math.min(1, Math.max(0, (now - t0 - delay) / dur));
      const eased = 1 - Math.pow(1 - k, 3);
      el.textContent = fmtNum(Math.round(to * eased)) + suf;
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function typeUp(root, instant){
  root.querySelectorAll('[data-typer]').forEach(el => {
    const full = el.previousElementSibling.textContent;
    clearInterval(el._tt);
    if (instant || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = full; return; }
    let n = 0; el.textContent = '';
    setTimeout(() => {
      el._tt = setInterval(() => {
        n = Math.min(full.length, n + 2);
        el.innerHTML = esc(full.slice(0, n)) + (n < full.length ? '<i></i>' : '');
        if (n >= full.length) clearInterval(el._tt);
      }, 24);
    }, 350);
  });
}
function bindReveal(){
  io && io.disconnect();
  const els = app.querySelectorAll('.rv');
  if (!('IntersectionObserver' in window)) { els.forEach(e=>{ e.classList.add('in'); countUp(e, true); typeUp(e, true); }); return; }
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); countUp(e.target); typeUp(e.target); io.unobserve(e.target); } }), { threshold: 0.12 });
  els.forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.height && r.bottom < 0) { el.classList.add('instant','in'); countUp(el, true); typeUp(el, true); } else io.observe(el);
  });
}

// Rotator: polls visibility (no reliance on scroll events / observers).
// On entering the viewport it shows the magazines, then swaps every 3 s in a loop.
function bindRotators(){ checkRotators(); }
function checkRotators(){
  const now = Date.now(), vh = window.innerHeight || document.documentElement.clientHeight;
  app.querySelectorAll('[data-rot]').forEach(rot => {
    const r = rot.getBoundingClientRect();
    const vis = r.height > 0 && r.top < vh * 0.9 && r.bottom > vh * 0.1;
    if (vis && !rot._vis) { rot.classList.remove('show-books'); rot._next = now + 3000; }
    else if (vis && now >= rot._next) { rot.classList.toggle('show-books'); rot._next = now + 3000; }
    else if (!vis && rot._vis) rot.classList.remove('show-books');
    rot._vis = vis;
  });
}
timer = setInterval(checkRotators, 200);

const intro = document.getElementById('intro');
const ov = document.getElementById('ov'), hint = document.getElementById('hint');
const t1 = document.getElementById('t1'), t2 = ['t2a','t2b','t2c'].map(id=>document.getElementById(id));
const c1 = document.getElementById('c1'), c2 = document.getElementById('c2');
const cl = v => Math.min(1, Math.max(0, v));
function paintIntro(){
  const [a, bp] = COPY[lang].manifesto;
  const dist = Math.max(1, intro.offsetHeight - window.innerHeight);
  const p = cl(-intro.getBoundingClientRect().top / dist);
  ov.style.opacity = cl(p / 0.08);
  hint.style.opacity = 1 - cl(p / 0.05);
  const total = a.length + bp.join('').length;
  const n = Math.round(cl((p - 0.08) / 0.8) * total);
  t1.textContent = a.slice(0, Math.min(n, a.length));
  let rest = Math.max(0, n - a.length);
  t2.forEach((node, i) => { const take = Math.min(rest, bp[i].length); node.textContent = bp[i].slice(0, take); rest -= take; });
  c1.style.display = n < a.length ? 'inline-block' : 'none';
  c2.style.display = n >= a.length ? 'inline-block' : 'none';
}
let ticking = false;
window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { paintIntro(); ticking = false; }); } }, { passive: true });
window.addEventListener('resize', () => { paintIntro(); checkRotators(); });

document.addEventListener('click', e => {
  const b = e.target.closest('[data-lang]');
  if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang; localStorage.setItem('nn-lang', lang);
  const y = window.scrollY; render(); window.scrollTo(0, y);
  app.querySelectorAll('.rv').forEach(el => { const r = el.getBoundingClientRect(); if (r.top < window.innerHeight) { el.classList.add('instant','in'); countUp(el, true); typeUp(el, true); } });
});

render();
})();
